mod.ed.update = [#00FFFF]Supernova-68 [#DE5D70]Auspicious2024
mod.ed.precautions = [#00FFFF]模组：[white]ERA.[grey]D[white]ark\n——————[red]注意事项[white]——————\n请不要用全球占领的存档\n建议过了[gold]行星发射终端[white]再来游玩此模组\n部分战役退出重进可能会导致任务失效，建议一次性通关战役\nIf you find language errors in the game, please adjust the language again

mod.ed.log = [white]——————[gold]更新内容[white]——————\n[#00FFFF]v1.1.2.0:[white]\n修复了部分贴图图层显示错误的问题\n修复了部分科技不显示的问题\n修复了地图名字显示错误的问题\n调整了多配方工厂液体数量不正确的问题\n新增生产：氯气采集器\n为进阶集成组装工厂添加了 弥漫 的生产配方，同时修改了解锁条件\n新地图：疾风峡湾

