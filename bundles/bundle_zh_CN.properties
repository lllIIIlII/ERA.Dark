——————地图——————

sector.ed-天南沼泽.name = 天南沼泽
sector.ed-天南沼泽.description = 靠近南极的一片大型沼泽,靠近敌方基地,十分危险。赛普罗时间22:29:16,此处传来巨响,已惊动大批敌人前往此处。调查事件原因,抵挡敌人的进攻。

sector.ed-巴尔切特波山麓.name = 巴尔切特波山麓
sector.ed-巴尔切特波山麓.description = 前往南极必须跨越的高山\n敌人正在从山口中涌出,消灭它们

sector.ed-山间谷地.name = 山间谷地
sector.ed-山间谷地.description = 两山之间的一处峡谷,穿过就能进入南极区域\n敌人已经顶上了我们,小心一切可能来敌的方向

sector.ed-南极前哨站.name = 南极前哨站
sector.ed-南极前哨站.description = 跨越群山,你终于来到了南极地区\n坏消息是,敌人的巡逻部队发现了你,大量飞行单位正朝你疾驰而来\n在山脚下布置防空阵线,挡住敌人的快节奏空袭！

sector.ed-跃迁门入口.name = 跃迁门入口
sector.ed-跃迁门入口.description = 巨大的空间门凭空出现在南极\n面对未知的世界\n稳健的工程师选择发展好后勤再出征

sector.ed-同步轨道空间站.name = 同步轨道空间站
sector.ed-同步轨道空间站.description = 备注：\n新手教程一份,专门给刚入坑的玩家做的\n如果你是mindustry大手子可以不看这个地图

sector.ed-奥伊兰盆地.name = 奥伊兰盆地
sector.ed-奥伊兰盆地.description = [奥伊兰]  普兰大陆东侧群山之中的富饶之地\n也是普兰文明对抗天灾的前线之一\n不久前,天灾切断了唯一的补给来源,这个钉死在天灾潮中的城市现在岌岌可危\n身为工程师,你需要帮助他们恢复生产和电力,死守并等待援军主力的到来

sector.ed-白虹贯墨.name = 白虹贯墨
sector.ed-白虹贯墨.description = 天灾于支援[奥伊兰]的必经之路上设置了多重防线，你的任务就是趁[奥伊兰]还没被天灾占领前为他们撕开一条生路\n这里的资源大多掌握在天灾手里，而你将带领突击队完成击破天灾据点的任务

sector.ed-疾风峡湾.name = 疾风峡湾
sector.ed-疾风峡湾.description = 你随游击队来到北方的II级侵蚀区进行对天灾的狙击任务\n此处矿物资源较为匮乏，缺少关键矿物，建议开启跨区快物流

